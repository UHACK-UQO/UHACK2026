services:
  nginx:
    image: nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./TLS/:/etc/ssl/
    networks:
      externe:
        ipv4_address: 173.10.10.20
    ports:
      - 80:80
      - 443:443

  dnsmasq:
    image: dockurr/dnsmasq
    restart: always
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
      - ./dnsmasq.sh:/usr/bin/dnsmasq.sh
    networks:
      externe:
        ipv4_address: 173.10.10.2

networks:
  externe:
    ipam:
      config:
        - subnet: 173.10.10.0/24