# This file is designed for production server deployment, not local development work
# For a containerized local dev environment, see: https://github.com/mastodon/mastodon/blob/main/docs/DEVELOPMENT.md#docker

services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      - ./postgres14:/var/lib/postgresql/data
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'

  redis:
    restart: always
    image: redis:7-alpine
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - ./redis:/data

  web:
    # You can uncomment the following line if you want to not use the prebuilt image, for example if you have local code changes
    build:
      context: .
      dockerfile: mastodon.Dockerfile
    # image: ghcr.io/mastodon/mastodon:v4.7.0
    restart: always
    env_file: 
      - ../coordination/nom_domaine.env
      - .env.production
    command: /bin/sh -c /opt/mastodon/installation/installation.sh
    networks:
      - externe
      - internal_network
    ports:
      - 1070:3000
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL',"curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    # ports:
    #   - '127.0.0.1:3000:3000'
    depends_on:
      - db
      - redis
      # - es
    volumes:
      - ./public/system:/mastodon/public/system
      - ./.env.production:/opt/mastodon/.env.production
      - ./installation:/opt/mastodon/installation
      - ../coordination/comptes_utilisateurs.json:/opt/mastodon/comptes.json

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.0
    restart: always
    env_file: .env.production
    command: node ./streaming/index.js
    networks:
      - externe
      - internal_network
    ports:
      - 1080:4000
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    depends_on:
      - db
      - redis

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.0
    restart: always
    env_file: .env.production
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
      - web
    networks:
      - internal_network
    volumes:
      - ./public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]

networks:
  externe:
  internal_network:
    internal: true