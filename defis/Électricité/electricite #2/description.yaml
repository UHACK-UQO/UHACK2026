type: "ctfd"

# Titre du défi
# [OBLIGATOIRE]
titre: "Électricité — Épisode 2/3 : Canal de commande caché"

# Description du défi. Supporte le markdown
# [OBLIGATOIRE]
description: |
  **Arc Électricité — épisode 2/3.**

  L'hameçon est retiré : grâce à votre analyse de l'épisode 1/3, vous savez
  que la **RTU47** de la sous-station 7 est tombée entre de mauvaises
  mains. Les attaquants exigent toujours leurs 12 847 crêpes bretonnes
  et préparent visiblement une coupure sur le quartier du Vieux-Marché.

  Nouvelle capture, prise quelques heures plus tard sur le lien de la
  sous-station : la RTU47 ne reçoit plus de telnet, mais elle **cause
  encore**. Le trafic a l'air anodin — presque trop. Les instructions des
  attaquants circulent par un canal discret, découpé, mélangé et noyé dans
  le bruit.

  **Votre mission :** reconstruisez le message complet. Les morceaux ne
  sont pas arrivés dans l'ordre, certains sont des leurres et tous sont
  encodés. Le drapeau reconstitué s'écrit tel quel (préfixe `UHACK{`
  compris).

  *(Épisode 3/3 : « Effacer pour mieux voler » — l'attaquant tente de
  tout effacer. Presque tout.)*

fichiers: ['capture_dns_rtu47_2026-09-24.pcap']

# flag du défi
# [OBLIGATOIRE]
drapeau: "UHACK{canal_dns_cache_empoisonne_7741}"

# Liste d'indices LAISSER VIDE POUR LE MOMENT
indices: []

