# Type de défiCTFd.
#     utilisateurs.
#     exposé.
#     
# Valeurs acceptées :
#   ctfd :
#     Le défi n'utilise aucune autre ressource de 
#     Ex.: Un fichier à télécharger.
#   statique :
#     Le défi nécessite qu'un service soit 
#     exposé, mais ce service est le même pour 
#     tous les Ex.: Exposer une API REST.
#   dynamique :
#     Le défi nécessite qu'un service pour chaque 
#     utilisateur soit Ex.: Exposer un boot2root.
#     NON SUPPORTÉ
# [OBLIGATOIRE]
type: ctfd

# Titre du défi
# [OBLIGATOIRE]
titre: "L'avis"

# Description du défi. Supporte le markdown
# [OBLIGATOIRE]
description: |-
  Les attaquants du système informatique tentent de vous transmettre une 
  lettre de rançon, mais on dirait que le message ne se rend pas! Il y a 
  trop d'interférence sur la ligne et manifestement, **le système de 
  correction d'erreur est défaillant**.

  Vous savez que ce dernier utilise un 
  [Code de Hamming](https://fr.wikipedia.org/wiki/Code_de_Hamming), mais 
  vous n'en connaissez pas les paramètres. Vous devrez rebâtir le système 
  pour décoder la communication des attaquants.

  ---

  The hackers are trying to transmit a ransom letter, but it seems the
  message isn't going through! There is too much noise on the line and
  clearly, **the error correction system is down**.

  You know the system uses a 
  [Hamming Code](https://en.wikipedia.org/wiki/Hamming_code), but you
  forget the parameters. You need to rebuild the system to decode the
  hacker's communication.

# Liste de fichiers à téléverser
fichiers:
  - "rançon.pdf.bin"

# flag du défi
# [OBLIGATOIRE]
drapeau: "UHACK{e7f1d6a99f63d22db73f3faccba68d42}"

# Liste d'indices, en ordre d'apparence. Supporte 
# le markdown.
indices: 
  - # Titre de l'indice
    titre: "Indice 1"
    
    # Contenu de l'indice
    description: |-
        Vous vous souvenez soudainement que le système utilisait un code de Hamming (15,11)
        
        You suddenly remember that the system used a (15,11) Hamming Code.
    
    # Coût en nombres de points pour ouvrir 
    # l'indice
    points: 50
    
    # Liste des indices devant être ouverts avant 
    # que celui-ci soit accessible. Cette liste 
    # représente l'indexe des indinces dans la 
    # présente liste.
    #prerequis:

# Solution du défi. Supporte le markdown. Cet 
# attribut est obligatoire.
# [OBLIGATOIRE]
solution: ""

# Paramètres du pointage pour ce défi. Le nombre 
# de points diminue à mesure que de plus en plus 
# de solutions sont soumises au défi.
pointage:
  # Nombre de points initial
  initial: 100
  
  # Fonction de décroissance des points.
  # Valeurs acceptées :
  #   constant :
  #     Le nombre de points reste constant tout 
  #     au long de l'événement. Avec cette 
  #     option, les paramètres `pointage.minimum` 
  #     et `pointage.decroissance` n'ont aucun 
  #     effet.
  #   lineaire :
  #     Le nombre de points diminue au même 
  #     rythme en fonction du nombre de solutions 
  #     soumises.
  #   logarithmique :
  #     Le nombre de points chute drastiquement 
  #     avec les premières soumissions et de plus 
  #     en plus doucement avec les suivantes.
  fonction: "logarithmique"
  
  # Nombre de points minimum. La décroissance ne 
  # passera pas en-dessous de ce niveau
  minimum: 10
  
  # Taux de décroissance des points. Est 
  # interprété différemment dépendamment de 
  # `pointage.fonction`.
  decroissance: 10

# Le défi est-il visible aux participants?
# Valeurs acceptées :
#   visible :
#     Les participants peuvent voir le défis
#   cache :
#     Le défi est caché aux participants.
etat: "visible"

# Liste des défis devant avoir été complété avant 
# de pouvoir accéder à celui-ci. Faites référence 
# aux défis par leur titre.
#prerequis:

# Si 'type' est 'statique' ou 'dynamique', le 
# script spécifié ici sera appelé pour installer 
# et démarrer le service à exposer.
#script_installation:

# Si 'type' est 'statique', l'ip spécifiée ici 
# sera utilisé pour rediriger les requêtes http.
#ip:

# Mettre à true si l'importation dans ctfd 
# nécessite un traitement spécial
#necessite_un_traitement_special: