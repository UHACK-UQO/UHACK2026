# Solution du défi. Supporte le markdown. Cet 
# attribut est obligatoire.
# [OBLIGATOIRE]
solution: |-
  Encodeur : 
  ```python
    # Code de Hamming 15,11

    import random

    # Lire le document
    document : bytearray
    with open("rançon.pdf","rb") as f:
        document = f.read() + b'\x00\x00'

    # Extraire les mots de 11 bits
    doc_11 : list[int] = [] # document en mots de 11 bits
    dec = 0 # décalage de l'octet
    sauter = False
    for i in range(len(document)-2):
        if sauter:
            sauter = False
            continue

        # Deux scénarios possibles : 
        # dec = [0;5] : 
        #[A A A A A A A A|B B B B B B B B]C C C C C C C C
        # |-------------------| 0 0 0 0 0
        # +0
        #
        # A A A A A[A A A B B B B B|B B B C C C C C]C C C
        #        +5 |-------------------| 0 0 0 0 0
        # 
        # mot = (AA << d) | (BB >> (8-d)) , (BB & ( 0xFF << (5-d) )) << d
        #
        # dec = [6;7]
        # A A A A A A[A A B B B B B B|B B C C C C C C]C C
        #          +6 |-------------------| 0 0 0 0 0
        #
        # A A A A A A A[A B B B B B B B|B C C C C C C C]C
        #            +7 |-------------------| 0 0 0 0 0
        #
        # mot = (AA << d) | (BB >> (8-d)) , ( (BB << d) | (CC >> (8-d)) ) & (0xFF << (d-5)) & 0xFF

        if dec <= 5:
            doc_11.append( int.from_bytes(
                bytearray([
                    ( ( document[i] << dec ) | ( document[i+1] >> (8-dec) ) ) & 0xFF,
                    ( ( document[i+1] & (0xFF << (5-dec)) ) << dec ) & 0xFF
                ]),
                byteorder='big'
            ))
        else:
            doc_11.append( int.from_bytes(
                bytearray([
                    ( ( document[i] << dec ) | ( document[i+1] >> (8-dec) ) ) & 0xFF,
                    ( ( document[i+1] << dec ) | (document[i+2] >> (8-dec) )) & (0xFF << 5) & 0xFF
                ]),
                byteorder='big'
            ))

        if dec < 5:
            dec = 3+dec
        else:
            dec = dec-5
            sauter = True

    # Créer les codes de Hammings
    doc_16 : list[int] = []
    for m_11 in doc_11:
        # Arrangement final : 
        #    pp p1 p2 d1 p3 d2 d3 d4 p4 d5 d6 d7 d8 d9 d10 d11
        # pp  x  x  x     x           x
        # p1     x     x     x     x     x     x     x       x
        # p2        x  x        x  x        x  x         x   x
        # p3              x  x  x  x              x  x   x   x
        # p4                          x  x  x  x  x  x   x   x
        
        # réarranger les bits
        m_16 = ( 
            ((m_11 & 0x0FE0) >> 5) | # 00001111 11100000 >> 5
            ((m_11 & 0x7000) >> 4) | # 01110000 00000000 >> 4
            ((m_11 & 0x8000) >> 3)   # 10000000 00000000 >> 3
            )
        
        # 01010101 01010101
        p1 = (((m_16 >> 12) ^ (m_16 >> 10) ^ (m_16 >> 8) ^ (m_16 >> 6) ^ (m_16 >> 4) ^ (m_16 >> 2) ^ m_16) & 0x0001) << 14
        # 00110011 00110011
        p2 = (((m_16 >> 12) ^ (m_16 >> 9)  ^ (m_16 >> 8) ^ (m_16 >> 5) ^ (m_16 >> 4) ^ (m_16 >> 1) ^ m_16) & 0x0001) << 13
        # 00001111 00001111
        p3 = (((m_16 >> 10) ^ (m_16 >> 9)  ^ (m_16 >> 8) ^ (m_16 >> 3) ^ (m_16 >> 2) ^ (m_16 >> 1) ^ m_16) & 0x0001) << 11
        # 00000000 11111111
        p4 = (((m_16 >> 6)  ^ (m_16 >> 5)  ^ (m_16 >> 4) ^ (m_16 >> 3) ^ (m_16 >> 2) ^ (m_16 >> 1) ^ m_16) & 0x0001) << 7
        # 01101000 10000000
        pp = (p1 << 1) ^ (p2 << 2) ^ (p3 << 4) ^ (p4 << 8)

        m_16 = m_16 | p1 | p2 | p3 | p4 | pp

        # Corruption
        m_16 = m_16 ^ (1 << random.randint(0,7))

        doc_16.append(m_16)

    # Transformer en séquence d'octets
    doc_8 : list[int] = []
    for m_16 in doc_16:
        doc_8.append(m_16 >> 8)
        doc_8.append(m_16 & 0xFF)

    doc_b = bytearray(doc_8)
    with open("rançon.pdf.bin","wb") as f:
        f.write(doc_b)
  ```

  Décodeur : 
  ```python
    # Hamming Code 15,11

    with open("rançon.pdf.bin","rb") as f:
        document = f.read()

    # Corriger la corruption
    doc_saint : list[int] = []
    for i in range(0,len(document),2):
        m = int.from_bytes([document[i], document[i+1]], byteorder='big')
        # px_r = rapporté, px_o = observé
        pp_r = (m & 0x8000) >> 15 # 10000000 00000000
        p1_r = (m & 0x4000) >> 14 # 01000000 00000000
        p2_r = (m & 0x2000) >> 13 # 00100000 00000000
        p3_r = (m & 0x0800) >> 11 # 00001000 00000000
        p4_r = (m & 0x0080) >> 7  # 00000000 10000000

        pp_o = p1_r ^ p2_r ^ p3_r ^ p4_r
        p1_o = ((m >> 12) ^ (m >> 10) ^ (m >> 8) ^ (m >> 6) ^ (m >> 4) ^ (m >> 2) ^ m) & 0x0001
        p2_o = ((m >> 12) ^ (m >> 9)  ^ (m >> 8) ^ (m >> 5) ^ (m >> 4) ^ (m >> 1) ^ m) & 0x0001
        p3_o = ((m >> 10) ^ (m >> 9)  ^ (m >> 8) ^ (m >> 3) ^ (m >> 2) ^ (m >> 1) ^ m) & 0x0001
        p4_o = ((m >> 6)  ^ (m >> 5)  ^ (m >> 4) ^ (m >> 3) ^ (m >> 2) ^ (m >> 1) ^ m) & 0x0001

        if pp_r != pp_o:
            if (p1_r ^ p1_o) + (p2_r ^ p2_o) + (p3_r ^ p3_o) + (p4_r + p4_o) > 1:
                print("[ERREUR] : Il y a trop de corruption. Impossible de récupérrer le message.")
                exit(-1)
            #else:
                #print("[ATTENTION] : Les bits de parités ont été affecté. Impossible de déterminer si le message est corrompu")
        else:
            # La combinaison des bits de parités affectés représente l'indexe du bit affecté
            j = ((p4_o ^ p4_r) << 3) | ((p3_o ^ p3_r) << 2) | ((p2_o ^ p2_r) << 1) | (p1_o ^ p1_r)
            m = m ^ (0x8000 >> j) # 10000000 00000000
        
        doc_saint.append(m >> 8)
        doc_saint.append(m & 0xFF)

    # Retirer les bits de parité
    doc_11 : list[int] = []
    for i in range(0,len(doc_saint),2):
        m_16 = int.from_bytes([doc_saint[i], doc_saint[i+1]], byteorder='big')
        doc_11.append(
            (m_16 << 3) & 0x8000 | # 10000000 0000000
            (m_16 << 4) & 0x7000 | # 01110000 0000000
            (m_16 << 5) & 0x0FE0   # 00001111 1110000
        )

    # Désérialiser les données
    dec = 0
    m_8 : int = 0
    doc_8 : list[int] = []
    for m_11 in doc_11:
        if dec <= 5:
            doc_8.append(m_8 | (m_11 >> (8 + dec)))
            m_8 = (m_11 >> dec) & 0xFF
            dec = dec+3
        else:
            doc_8.append(m_8 | (m_11 >> (8 + dec)))
            doc_8.append((m_11 >> dec) & 0xFF)
            m_8 = (m_11 << (8-dec)) & 0xFF
            dec = dec-5

    with open("rançon.pdf","wb") as f:
        f.write(bytearray(doc_8))
  ```

# Paramètres du pointage pour ce défi. Le nombre 
# de points diminue à mesure que de plus en plus 
# de solutions sont soumises au défi.
pointage:
  # Nombre de points initial
  initial: 100
  
  # Fonction de décroissance des points.
  # Valeurs acceptées :
  #   constant :
  #     Le nombre de points reste constant tout 
  #     au long de l'événement. Avec cette 
  #     option, les paramètres `pointage.minimum` 
  #     et `pointage.decroissance` n'ont aucun 
  #     effet.
  #   lineaire :
  #     Le nombre de points diminue au même 
  #     rythme en fonction du nombre de solutions 
  #     soumises.
  #   logarithmique :
  #     Le nombre de points chute drastiquement 
  #     avec les premières soumissions et de plus 
  #     en plus doucement avec les suivantes.
  fonction: "logarithmique"
  
  # Nombre de points minimum. La décroissance ne 
  # passera pas en-dessous de ce niveau
  minimum: 10
  
  # Taux de décroissance des points. Est 
  # interprété différemment dépendamment de 
  # `pointage.fonction`.
  decroissance: 10

# Le défi est-il visible aux participants?
# Valeurs acceptées :
#   visible :
#     Les participants peuvent voir le défis
#   cache :
#     Le défi est caché aux participants.
etat: "visible"

