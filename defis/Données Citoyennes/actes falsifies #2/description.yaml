# [OBLIGATOIRE]
type: "ctfd"

# Titre du défi
# [OBLIGATOIRE]
titre: "Actes falsifiés — épisode 2/3 : les pixels indiscrets"

# Description du défi. Supporte le markdown
# [OBLIGATOIRE]
description: |
  Le commentaire EXIF retrouvé dans l'acte de naissance précédent
  désignait l'acte de mariage n° 0417 : « régénérer l'acte de mariage
  n.417 directement au niveau des pixels ». L'équipe de la ville a
  récupéré le scan correspondant — et le falsificateur a travaillé
  vite fait, directement dans l'image.

  **Épisode 2/3** de la série « Actes falsifiés » (ARC-04 — données
  citoyens). L'image semble intacte, mais les bits de poids faible du
  canal rouge, lus dans l'ordre de lecture (ligne par ligne, bit de
  poids fort en premier), forment un message binaire préfixé par le
  magic `LS` suivi d'une longueur sur 2 octets (big-endian). Et le flag
  n'est pas le seul à se cacher dans ces pixels : le message du
  falsificateur se poursuit après l'accolade fermante — il annonce sa
  prochaine « création ».

  Fichier fourni : `acte_mariage_0417.png`

# Liste de fichiers à téléverser
fichiers: ['acte_mariage_0417.png']

# flag du défi
# [OBLIGATOIRE]
drapeau: "UHACK{les_blancs_discrets_portent_tout}"

# Liste d'indices LAISSER VIDE POUR LE MOMENT
indices: []

# Solution du défi. LAISSER VIDE POUR LE MOMENT
solution: ""

# Paramètres du pointage pour ce défi. Le nombre 
# de points diminue à mesure que de plus en plus 
# de solutions sont soumises au défi.
pointage:
  # Nombre de points initial
  initial: 100
  # Fonction de décroissance des points.
  # Valeurs acceptées :
  #   constant :
  #     Le nombre de points reste constant tout 
  #     au long de l'événement. Avec cette 
  #     option, les paramètres `pointage.minimum` 
  #     et `pointage.decroissance` n'ont aucun 
  #     effet.
  #   lineaire :
  #     Le nombre de points diminue au même 
  #     rythme en fonction du nombre de solutions 
  #     soumises.
  #   logarithmique :
  #     Le nombre de points chute drastiquement 
  #     avec les premières soumissions et de plus 
  #     en plus doucement avec les suivantes.
  fonction: "logarithmique"
  # Nombre de points minimum. La décroissance ne 
  # passera pas en-dessous de ce niveau
  minimum: 10
  # Taux de décroissance des points. Est 
  # interprété différemment dépendamment de 
  # `pointage.fonction`.
  decroissance: 10
# Le défi est-il visible aux participants?
# Valeurs acceptées :
#   visible :
#     Les participants peuvent voir les défis
#   cache :
#     Le défi est caché aux participants.
etat: "cache"
