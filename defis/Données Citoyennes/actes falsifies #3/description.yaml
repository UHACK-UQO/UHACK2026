# [OBLIGATOIRE]
type: "ctfd"

# Titre du défi
# [OBLIGATOIRE]
titre: "Actes falsifiés — épisode 3/3 : le fantôme du JPEG"

# Description du défi. Supporte le markdown
# [OBLIGATOIRE]
description: |
  Dernière pièce du lot du SCANSTATION-04 : un acte de décès. Les deux
  premiers épisodes ont prouvé que le falsificateur travaille vite, mais
  pas proprement.

  Ce document a été **réenregistré deux fois** : le scan original a été
  sauvegardé en JPEG qualité 92, puis une zone a été retouchée et le
  fichier réenregistré en qualité 85. La double insertion laisse une
  empreinte : une analyse par niveau d'erreur (ELA — réenregistrer
  l'image et comparer les blocs 8×8) localise la zone falsifiée.

  Mais ce n'est pas tout. Le falsificateur a aussi glissé un fragment
  binaire directement dans les **coefficients DCT quantifiés** du canal
  luminance (Y) du document final — dans les bits de poids faible,
  à raison d'un bit tous les 9 coefficients. Le point de départ n'est
  **pas** fixe dans le document : c'est le premier bloc 8×8 que l'ELA
  désigne comme suspect (le coin haut-gauche de la zone à une seule
  compression) qui donne l'ancre — sans localiser cette zone, impossible
  de savoir où commencer à lire. Le fragment est préfixé par le magic
  `JD` suivi d'une longueur sur 2 octets (big-endian).

  **Épisode 3/3** de la série « Actes falsifiés » (ARC-04 — données
  citoyens). Il faudra un outil capable de lire les coefficients DCT
  bruts d'un JPEG (en Python : `jpegio`, ou équivalent).

  Fichier fourni : `acte_deces_0088.jpg`

# Liste de fichiers à téléverser
fichiers: ['acte_deces_0088.jpg']

# flag du défi
# [OBLIGATOIRE]
drapeau: "UHACK{le_jpeg_ne_pardonne_pas_le_reusinage}"

