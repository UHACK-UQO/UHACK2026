type: "ctfd"

titre: "L'appel détourné"

description: |
  **ARC-08 — Services d'urgence**

  Une habitante a enregistré sur son répondeur un appel au 911 passé dans la
  nuit : la ligne a été détournée par les attaquants et l'appelant a
  laissé un message avant de raccrocher. L'enregistrement sonne presque
  normal — tonalité, une voix étouffée, un décrochage — mais les analystes du
  centre de traitement municipal sont formels : **quelque chose se cache dans
  ce fichier**.

  Écoutez l'appel… puis écoutez-le autrement. Le drapeau est inscrit dans
  l'enregistrement, mais pas pour les oreilles : il vous faudra regarder le
  signal **dans le domaine fréquentiel** (spectrogramme). Audacity, SoX ou
  un script maison feront l'affaire.

