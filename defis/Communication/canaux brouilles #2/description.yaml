type: "ctfd"

titre: "Canaux brouillés — épisode 2/3 : Le masque jetable jeté deux fois"

description: |
  Grâce à l'épisode précédent, la cellule cyber lisait à nouveau les
  consignes radio… jusqu'à ce que les attaquants changent de
  méthode. Leur nouvel outil est présenté comme « mathématiquement
  inviolable » : un **masque jetable**, appliqué octet par octet
  (XOR) sur chaque message.

  Mais un masque jetable n'est inviolable que s'il est utilisé **une
  seule fois**. Or ce matin, le standardiste du service météo a
  retransmis en clair sur le canal d'entraide un bulletin qui existait
  aussi en version chiffrée — et les attaquants ont diffusé leur propre
  consigne juste après, avec apparemment la même suite secrète.

  Les deux captures chiffrées et le bulletin météo en clair sont dans
  le dossier d'analyse. Reconstituez le message des attaquants et
  récupérez le code de validation.

  *(Épisode 2 sur 3 de l'enquête « Canaux brouillés ».)*

fichiers:
