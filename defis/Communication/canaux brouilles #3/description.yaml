type: "ctfd"

titre: "Canaux brouillés — épisode 3/3 : Le module obsolète"

description: |
  L'enquête touche à sa fin. Les deux premières failles des attaquants
  étaient de l'amateurisme ; la troisième est une erreur de conception.
  Pour sécuriser leurs ordres de rançon, les attaquants sont passés au
  **chiffrement asymétrique RSA** — mais avec une bibliothèque obsolète,
  « RSALegacyFast », qui génère des **exposants privés anormalement
  courts** pour accélérer les déchiffrements sur leur matériel radio
  embarqué.

  L'équipe d'infiltration a exfiltré un extrait de la configuration du
  module, et la cellule cyber a intercepté un message chiffré destiné à
  leur chef, accompagné de sa clé publique (récupérée sur un relais
  compromis).

  Trouvez la faiblesse, retrouvez l'exposant privé et déchiffrez le
  message : il contient leur mot de passe maître de la journée.

  *(Épisode 3 sur 3 de l'enquête « Canaux brouillés » — l'attaque
  demande de mettre les mains dans les fractions continues, mais tout
  est faisable avec Python et la bibliothèque standard.)*

fichiers:
