services:
  mail:
    build:
      context: .
      dockerfile: dms.Dockerfile
    restart: always
    post_start: 
      - command: /bin/sh -c /tmp/installation/installation.sh
    env_file: 
      - .env
    volumes:
      - ./dms/mail-data:/var/mail
      - ./dms/mail-state:/var/mail-state
      - ./dms/mail-logs:/var/log/mail
      - ./dms/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/locatime:ro
      - ./installation:/tmp/installation
      - ../coordination/comptes_utilisateurs.json:/tmp/comptes.json
    networks:
      - externe
    ports:
      - 143:143 # IMAP
      - 25:25   # SMTP
    dns: 173.30.10.1

  roundcube:
    image: roundcube/roundcubemail
    restart: always
    env_file: .env
    ports:
      - 1060:80
    networks:
      - externe
    dns: 173.30.10.1

networks:
  externe:
    ipam:
      config:
        - subnet: 173.30.10.0/24
